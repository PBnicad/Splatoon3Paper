; PlatformIO Project Configuration File
;
; Target: M5Stack M5Paper v1.1
;   SoC    : ESP32-D0WDQ6-V3 @ 240MHz
;   Flash  : 16MB
;   PSRAM  : 8MB (Quad-SPI)
;   Display: 4.7" 540x960 e-paper (IT8951), GT911 capacitive touch
;
; Official references:
;   https://docs.m5stack.com/en/core/M5Paper
;   https://github.com/m5stack/M5Unified  (system / buttons / touch / power)
;   https://github.com/m5stack/M5GFX      (graphics incl. IT8951 e-paper)
;
; Note: M5Paper has no dedicated board definition in the official
; espressif32 platform, so we start from esp32dev and override the
; memory layout below to match the real hardware.

[env:m5paper]
platform = espressif32
board = esp32dev
framework = arduino

; --- memory layout: 16MB flash + 8MB Quad-SPI PSRAM ---
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi
board_upload.flash_size = 16MB
; 4MB app + 12MB LittleFS（中文字库 ~1.3MB + 缓存数据）
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_LOOP_STACK_SIZE=32768

; --- serial ---
monitor_speed = 115200               ; M5Unified default baud rate
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; --- official M5Stack libraries (M5Unified requires M5GFX) ---
lib_deps =
    m5stack/M5Unified@^0.2.20
    m5stack/M5GFX@^0.2.27
    bblanchon/ArduinoJson@^7.4.3
